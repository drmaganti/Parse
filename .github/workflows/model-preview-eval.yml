name: P0 Live Model Eval

on:
  push:
    branches: [agent/p0-parser-hardening]
  workflow_dispatch:

jobs:
  model-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Evaluate production model path
        env:
          EVAL_BASE_URL: https://getparse.app
          MODEL_RUNS: 1
          MODEL_MIN_PASS_RATE: 0.95
        run: npm run eval:live
