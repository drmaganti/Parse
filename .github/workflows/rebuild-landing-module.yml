name: rebuild-landing-module

on:
  push:
    branches: [agent/rebuild-landing-module]
    paths:
      - ".github/workflows/rebuild-landing-module.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-landing-module
      - name: Update actual homepage and remove temporary workarounds
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/LandingV2.tsx')
          s = p.read_text()
          site_import = 'import { PORTFOLIO_URL, GITHUB_URL } from "../lib/site";'
          if 'from "../lib/analytics"' not in s:
              s = s.replace(site_import, site_import + '\nimport { trackEvent } from "../lib/analytics";', 1)
          mobile_old = '@media(max-width:760px){.ln2-hero{grid-template-columns:1fr;gap:28px}.ln2-cards{grid-template-columns:1fr}.ln2-signin{display:none}}'
          mobile_new = '@media(max-width:760px){.ln2-hero{grid-template-columns:1fr;gap:28px}.ln2-cards{grid-template-columns:1fr}.ln2-signin,.ln2-investor-nav{display:none}}'
          if mobile_old not in s: raise SystemExit('mobile CSS target not found')
          s = s.replace(mobile_old, mobile_new, 1)
          nav_target = '<a href="/methodology" className="ln2-btn ln2-ghost ln2-sm">How it works</a>'
          nav_insert = '<a href="/investors" className="ln2-btn ln2-ghost ln2-sm ln2-investor-nav" onClick={() => trackEvent("investor_hub_clicked", { placement: "header" })}>Investors</a>\n          ' + nav_target
          if nav_target not in s: raise SystemExit('nav target not found')
          s = s.replace(nav_target, nav_insert, 1)
          section_target = '      <div style={{ margin: "44px 0 12px", maxWidth: 680 }}>'
          section = ('      <section style={{ marginTop: 44, background: T.surface, border: `1px solid ${T.border}`, borderRadius: 14, padding: "22px 24px", maxWidth: 760 }}>\n'
                     '        <div style={{ fontFamily: DISP, fontSize: 21, fontWeight: 600, letterSpacing: "-0.02em", marginBottom: 8 }}>Screen famous investor portfolios</div>\n'
                     '        <p style={{ color: T.inkSoft, fontSize: 14.5, lineHeight: 1.55, margin: "0 0 14px", maxWidth: 680 }}>Explore reported holdings from Warren Buffett, Cathie Wood, Bill Ackman, Michael Burry, Stanley Druckenmiller, and Ray Dalio—then filter them in plain English.</p>\n'
                     '        <a href="/investors" className="ln2-link" onClick={() => trackEvent("investor_hub_clicked", { placement: "home_discovery" })}>Explore investor portfolios →</a>\n'
                     '      </section>\n\n')
          if section_target not in s: raise SystemExit('discovery section target not found')
          s = s.replace(section_target, section + section_target, 1)
          p.write_text(s)
          root = Path('app/page.tsx')
          root_text = root.read_text().replace('<Landing key="home-investors-v1" mode="home"', '<Landing mode="home"', 1)
          root.write_text(root_text)
          route = Path('app/api/internal/revalidate-home/route.ts')
          if route.exists(): route.unlink()
      - name: Commit homepage fix
        run: |
          git config user.name "drmaganti"
          git config user.email "ram.maganti@outlook.com"
          git add -A
          git commit -m "Update production homepage investor links"
          git push origin HEAD:agent/rebuild-landing-module
