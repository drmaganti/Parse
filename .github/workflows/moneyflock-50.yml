name: MoneyFlock-style 50

on:
  push:
    branches:
      - agent/retail-investor-p0-p2
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      GROQ_API_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx eval/moneyflock-style-50.ts
