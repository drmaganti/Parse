name: verify-long-term-fundamentals-data

on:
  push:
    branches: [agent/long-term-fundamentals]
    paths:
      - ".github/workflows/verify-long-term-fundamentals-data.yml"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/long-term-fundamentals
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Populate production fundamentals
        run: npm run ingest
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USE_CANDLES: ${{ vars.USE_CANDLES }}
