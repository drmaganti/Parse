name: verify-homepage-investor-links

on:
  push:
    branches: [agent/verify-five-investor-pages]
    paths:
      - ".github/workflows/verify-homepage-investor-links.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser verifier
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify rendered production homepage
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const response = await page.goto('https://getparse.app/?verify=231b12b13880dff5f339e80527ab9116e24da198', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.getByRole('link', { name: 'Investors', exact: true }).waitFor({ state: 'visible', timeout: 20000 });
            await page.getByText('Screen famous investor portfolios', { exact: true }).waitFor({ state: 'visible', timeout: 20000 });
            const navHref = await page.getByRole('link', { name: 'Investors', exact: true }).getAttribute('href');
            const discovery = page.getByRole('link', { name: 'Explore investor portfolios', exact: false });
            await discovery.waitFor({ state: 'visible', timeout: 20000 });
            const discoveryHref = await discovery.getAttribute('href');
            if (response?.status() !== 200 || navHref !== '/investors' || discoveryHref !== '/investors') throw new Error(`Verification failed: status=${response?.status()}, nav=${navHref}, discovery=${discoveryHref}`);
            console.log('LIVE_HOMEPAGE_INVESTORS: PASS');
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
