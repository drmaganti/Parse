name: verify-homepage-investor-links

on:
  push:
    branches: [agent/verify-five-investor-pages]
    paths:
      - ".github/workflows/verify-homepage-investor-links.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser verifier
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify rendered production homepage
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.goto('https://getparse.app/?verify=f3330e4549d7baa411ba2df53e97ae7b673f15ec', { waitUntil: 'networkidle' });
            await page.getByRole('link', { name: 'Investors', exact: true }).waitFor({ state: 'visible', timeout: 15000 });
            await page.getByText('Screen famous investor portfolios', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
            await page.getByRole('link', { name: 'Explore investor portfolios', exact: false }).waitFor({ state: 'visible', timeout: 15000 });
            const navHref = await page.getByRole('link', { name: 'Investors', exact: true }).getAttribute('href');
            const discoveryHref = await page.getByRole('link', { name: 'Explore investor portfolios', exact: false }).getAttribute('href');
            if (navHref !== '/investors' || discoveryHref !== '/investors') throw new Error(`Unexpected hrefs: ${navHref}, ${discoveryHref}`);
            console.log('LIVE_HOMEPAGE_INVESTORS: PASS');
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
