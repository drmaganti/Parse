name: verify-homepage-investor-links

on:
  push:
    branches: [agent/verify-five-investor-pages]
    paths:
      - ".github/workflows/verify-homepage-investor-links.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser verifier
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Compare deployment and production alias
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const url of [
              'https://parse-n7k3qfl4o-nrichapps.vercel.app/',
              'https://getparse.app/?verify=f3330e4549d7baa411ba2df53e97ae7b673f15ec'
            ]) {
              const page = await browser.newPage();
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForTimeout(5000);
              const links = await page.locator('a').evaluateAll(as => as.map(a => ({ text: (a.textContent || '').trim(), href: a.getAttribute('href') })).filter(x => x.text || x.href));
              const body = (await page.locator('body').innerText()).slice(0, 2500);
              console.log('\nURL:', page.url());
              console.log('STATUS:', response?.status());
              console.log('LINKS:', JSON.stringify(links));
              console.log('BODY:', body.replace(/\n/g, ' | '));
              await page.close();
            }
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
