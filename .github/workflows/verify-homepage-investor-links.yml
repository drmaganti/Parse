name: verify-homepage-investor-links

on:
  push:
    branches: [agent/verify-five-investor-pages]
    paths:
      - ".github/workflows/verify-homepage-investor-links.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production cache headers
        run: |
          set -euo pipefail
          echo '=== ROOT ==='
          curl -sSIL 'https://getparse.app/?verify=74abcede3a8ae62b8f6f1beb448d8bdfbbfb3f93' | grep -iE '^(HTTP/|age:|cache-control:|etag:|x-vercel-cache:|x-vercel-id:|server:|date:|location:)'
          echo '=== INVESTORS ==='
          curl -sSIL 'https://getparse.app/investors?verify=74abcede3a8ae62b8f6f1beb448d8bdfbbfb3f93' | grep -iE '^(HTTP/|age:|cache-control:|etag:|x-vercel-cache:|x-vercel-id:|server:|date:|location:)'
