name: Patch results columns
on:
  push:
    branches: [agent/results-columns]
    paths:
      - scripts/patch-results-columns.py
      - .github/workflows/patch-results-columns.yml
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply results column visibility rules') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/results-columns
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python scripts/patch-results-columns.py
      - run: npm ci
      - run: npm run build
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/try/page.tsx scripts/patch-results-columns.py .github/workflows/patch-results-columns.yml
          git commit -m "Apply results column visibility rules"
          git push origin HEAD:agent/results-columns
