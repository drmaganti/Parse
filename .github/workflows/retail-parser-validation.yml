name: retail-parser-validation

on:
  push:
    branches: [agent/retail-investor-p0-p2]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Probe available fundamental metrics
        shell: bash
        run: |
          set -o pipefail
          npx tsx eval/inspect-finnhub-metrics.ts | tee finnhub-probe.txt
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - name: Run retail and parser suites
        shell: bash
        run: |
          set -o pipefail
          npm run test:retail-full 2>&1 | tee retail-validation.txt
      - name: Production build
        run: npx next build
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-validation-diagnostics
          path: |
            finnhub-probe.txt
            retail-validation.txt
          if-no-files-found: warn
          retention-days: 1
