name: probe-fundamental-metrics

on:
  push:
    branches: [agent/long-term-fundamentals]
    paths:
      - ".github/workflows/probe-fundamental-metrics.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect available AAPL basic-financial keys
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          node <<'NODE'
          const key = process.env.FINNHUB_API_KEY;
          if (!key) throw new Error('Missing FINNHUB_API_KEY');
          const url = `https://finnhub.io/api/v1/stock/metric?symbol=AAPL&metric=all&token=${key}`;
          fetch(url).then(async r => {
            if (!r.ok) throw new Error(`Finnhub ${r.status}`);
            const d = await r.json();
            const metric = d.metric || {};
            for (const k of ['operatingMarginTTM','totalDebt/totalEquityQuarterly','netInterestCoverageTTM','revenueGrowth3Y','epsGrowth3Y','evEbitdaTTM','enterpriseValue','currentEv/freeCashFlowTTM','marketCapitalization']) console.log(`${k}=${metric[k]}`);
            for (const k of ['roic','fcfMargin']) console.log(`${k} series=${JSON.stringify(d.series?.annual?.[k] || [])}`);
          }).catch(e => { console.error(e); process.exit(1); });
          NODE
