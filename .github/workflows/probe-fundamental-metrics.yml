name: probe-fundamental-metrics

on:
  push:
    branches: [agent/long-term-fundamentals]
    paths:
      - ".github/workflows/probe-fundamental-metrics.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect available AAPL basic-financial keys
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          node <<'NODE'
          const key = process.env.FINNHUB_API_KEY;
          if (!key) throw new Error('Missing FINNHUB_API_KEY');
          const url = `https://finnhub.io/api/v1/stock/metric?symbol=AAPL&metric=all&token=${key}`;
          fetch(url).then(async r => {
            if (!r.ok) throw new Error(`Finnhub ${r.status}`);
            const d = await r.json();
            const metric = d.metric || {};
            const terms = /(return|roic|operating|margin|cash|free|debt|interest|revenue|sales|eps|earnings|ebitda|enterprise|ev)/i;
            const rows = Object.keys(metric).filter(k => terms.test(k)).sort().map(k => `${k}=${metric[k]}`);
            console.log(rows.join('\n'));
            console.log('\nSERIES ANNUAL KEYS');
            console.log(Object.keys(d.series?.annual || {}).filter(k => terms.test(k)).sort().join('\n'));
          }).catch(e => { console.error(e); process.exit(1); });
          NODE
