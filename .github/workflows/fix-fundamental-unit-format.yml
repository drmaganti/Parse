name: fix-fundamental-unit-format

on:
  push:
    branches: [agent/long-term-fundamentals]
    paths:
      - ".github/workflows/fix-fundamental-unit-format.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/long-term-fundamentals
      - name: Fix filter units
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = 'function formatFilter(f: Pick<Filter, "field" | "op" | "value">) { const m = FIELDS[f.field]; if (!m) return `${f.field} ${f.op} ${f.value}`; if (m.kind === "cat") return `${m.label} ${f.op === "!=" ? "is not" : "is"} ${f.value}`; return `${m.label} ${f.op} ${f.value}${m.unit ?? ""}`; }'
          new = 'function formatFilter(f: Pick<Filter, "field" | "op" | "value">) { const m = FIELDS[f.field]; if (!m) return `${f.field} ${f.op} ${f.value}`; if (m.kind === "cat") return `${m.label} ${f.op === "!=" ? "is not" : "is"} ${f.value}`; const suffix = m.unit === "%" || m.unit === "×" ? m.unit : m.unit === "$B" ? "B" : ""; return `${m.label} ${f.op} ${f.value}${suffix}`; }'
          if old not in s:
              raise SystemExit('formatFilter target not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit fix
        run: |
          git config user.name "drmaganti"
          git config user.email "ram.maganti@outlook.com"
          git add app/page.tsx
          git commit -m "Fix screen filter unit formatting"
          git push origin HEAD:agent/long-term-fundamentals
