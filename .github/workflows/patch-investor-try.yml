name: patch-investor-try

on:
  push:
    branches: [agent/add-five-investor-collections]
    paths:
      - ".github/workflows/patch-investor-try.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-five-investor-collections
      - name: Patch collection screening UX
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/try/page.tsx")
          s = p.read_text()
          old = '.eq("collection_slug", collectionSlug).order("report_date", { ascending: false }).limit(250);'
          new = '.eq("collection_slug", collectionSlug).order("report_date", { ascending: false }).limit(2000);'
          if old not in s:
              raise SystemExit("holdings limit target not found")
          s = s.replace(old, new, 1)
          old_label = 'exact?.universe?.label || (collectionSlug === "warren-buffett" ? "Berkshire Hathaway reported holdings" : collectionSlug)'
          new_label = 'exact?.universe?.label || (collectionSlug === "warren-buffett" ? "Berkshire Hathaway reported holdings" : collectionSlug === "bill-ackman" ? "Pershing Square reported holdings" : collectionSlug === "cathie-wood" ? "ARK Innovation ETF (ARKK) holdings" : collectionSlug === "michael-burry" ? "Scion Asset Management reported holdings" : collectionSlug === "stanley-druckenmiller" ? "Duquesne Family Office reported holdings" : collectionSlug === "ray-dalio" ? "Bridgewater Associates reported holdings" : collectionSlug)'
          if old_label not in s:
              raise SystemExit("collection label target not found")
          s = s.replace(old_label, new_label, 1)
          old_copy = '"Try three screen updates without creating an account. Current universe: {universeLabel}, refreshed daily."'
          new_copy = '`Try three screen updates without creating an account. Current universe: ${universeLabel}, refreshed daily.`'
          if old_copy not in s:
              raise SystemExit("universe copy target not found")
          s = s.replace(old_copy, new_copy, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "drmaganti"
          git config user.email "ram.maganti@outlook.com"
          git add app/try/page.tsx
          git commit -m "Support full investor collection screening"
          git push origin HEAD:agent/add-five-investor-collections
