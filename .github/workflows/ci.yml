name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      GROQ_API_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Blind retail-investor 50 v1 baseline
        shell: bash
        run: |
          cat > eval/__blind50_v1_temp.ts <<'BLIND50EOF'
          import { parseQuery } from "../lib/parse";
          
          type Case = {
            id: string;
            cohort: "moneyflock_like" | "experienced_retail";
            query: string;
            expectedFilters: Array<{ field: string; op: string; value: string | number }>;
            assumptionNeedles: string[];
          };
          
          const cases: Case[] = [{"id":"B01","cohort":"moneyflock_like","query":"Find software companies that are making money, growing sales above 18%, with low leverage and a sensible valuation.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">","value":18},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Technology"}],"assumptionNeedles":[]},{"id":"B02","cohort":"moneyflock_like","query":"Healthcare stocks in the black with revenue up more than 12%, little debt, and not too pricey.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">","value":12},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Healthcare"}],"assumptionNeedles":[]},{"id":"B03","cohort":"moneyflock_like","query":"Profitable bank names with top-line growth over 7%, conservative leverage and a fair price.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">","value":7},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Financials"}],"assumptionNeedles":[]},{"id":"B04","cohort":"moneyflock_like","query":"Show me profitable energy companies with double-digit sales growth, modest debt, reasonably valued.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">=","value":10},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Energy"}],"assumptionNeedles":[]},{"id":"B05","cohort":"moneyflock_like","query":"Biotech names making money, growing revenue north of 15%, low debt, valuation isn't stretched.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">","value":15},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Healthcare"}],"assumptionNeedles":[]},{"id":"B06","cohort":"moneyflock_like","query":"Semiconductor stocks with positive earnings, revenue growth >25%, D/E under 0.6 and P/E under 32.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">","value":25},{"field":"debtEquity","op":"<","value":0.6},{"field":"pe","op":"<","value":32},{"field":"sector","op":"==","value":"Technology"}],"assumptionNeedles":[]},{"id":"B07","cohort":"moneyflock_like","query":"Profitable consumer companies with revenue growth between 10% and 20%, debt/equity below 0.8 and P/E below 24.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">=","value":10},{"field":"revGrowth","op":"<=","value":20},{"field":"debtEquity","op":"<","value":0.8},{"field":"pe","op":"<","value":24},{"field":"sector","op":"==","value":"Consumer"}],"assumptionNeedles":[]},{"id":"B08","cohort":"moneyflock_like","query":"Industrial stocks growing sales at least 8%, profitable, lightly leveraged, fair valuation.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">=","value":8},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Industrials"}],"assumptionNeedles":[]},{"id":"B09","cohort":"moneyflock_like","query":"REITs that are profitable, revenue growth over 6%, low leverage, and reasonably valued.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">","value":6},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Real Estate"}],"assumptionNeedles":[]},{"id":"B10","cohort":"moneyflock_like","query":"Utility companies in the black, revenue expanding above 5%, low debt and not expensive.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">","value":5},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Utilities"}],"assumptionNeedles":[]},{"id":"B11","cohort":"moneyflock_like","query":"Technology growth stocks with reasonable valuation and low leverage.","expectedFilters":[{"field":"revGrowth","op":">","value":15},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Technology"}],"assumptionNeedles":[]},{"id":"B12","cohort":"moneyflock_like","query":"Healthcare growth companies that are profitable and fairly valued.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">","value":15},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Healthcare"}],"assumptionNeedles":[]},{"id":"B13","cohort":"moneyflock_like","query":"Profitable software stocks with high ROIC, low leverage and a sensible valuation.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"roic","op":">","value":15},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Technology"}],"assumptionNeedles":[]},{"id":"B14","cohort":"moneyflock_like","query":"High-ROIC semiconductor names growing revenue above 15% with modest debt and fair valuation.","expectedFilters":[{"field":"roic","op":">","value":15},{"field":"revGrowth","op":">","value":15},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Technology"}],"assumptionNeedles":[]},{"id":"B15","cohort":"moneyflock_like","query":"Profitable pharma stocks with sales growth 20%+, debt is modest, priced reasonably.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">=","value":20},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Healthcare"}],"assumptionNeedles":[]},{"id":"B16","cohort":"moneyflock_like","query":"Tech companies: operating margin over 8%, sales growth above 20%, D/E below 0.5, forward P/E under 25.","expectedFilters":[{"field":"operatingMargin","op":">","value":8},{"field":"revGrowth","op":">","value":20},{"field":"debtEquity","op":"<","value":0.5},{"field":"forwardPe","op":"<","value":25},{"field":"sector","op":"==","value":"Technology"}],"assumptionNeedles":[]},{"id":"B17","cohort":"moneyflock_like","query":"Healthcare stocks with positive earnings, 3-year sales CAGR over 10%, low leverage, P/E below 28.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth3Y","op":">","value":10},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":28},{"field":"sector","op":"==","value":"Healthcare"}],"assumptionNeedles":[]},{"id":"B18","cohort":"moneyflock_like","query":"Consumer names making money, 3Y EPS CAGR at least 12%, low debt, reasonably valued.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"epsGrowth3Y","op":">=","value":12},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Consumer"}],"assumptionNeedles":[]},{"id":"B19","cohort":"moneyflock_like","query":"Financials with revenue growth between 5% and 12%, profitable, D/E under 1.2 and P/B below 2.","expectedFilters":[{"field":"revGrowth","op":">=","value":5},{"field":"revGrowth","op":"<=","value":12},{"field":"operatingMargin","op":">","value":0},{"field":"debtEquity","op":"<","value":1.2},{"field":"pb","op":"<","value":2},{"field":"sector","op":"==","value":"Financials"}],"assumptionNeedles":[]},{"id":"B20","cohort":"moneyflock_like","query":"Industrials with sales growth >10%, operating margin >5%, debt/equity <0.9 and EV/EBITDA under 14.","expectedFilters":[{"field":"revGrowth","op":">","value":10},{"field":"operatingMargin","op":">","value":5},{"field":"debtEquity","op":"<","value":0.9},{"field":"evEbitda","op":"<","value":14},{"field":"sector","op":"==","value":"Industrials"}],"assumptionNeedles":[]},{"id":"B21","cohort":"moneyflock_like","query":"Profitable software companies with >20% revenue growth, low leverage and forward P/E <22.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">","value":20},{"field":"debtEquity","op":"<","value":1},{"field":"forwardPe","op":"<","value":22},{"field":"sector","op":"==","value":"Technology"}],"assumptionNeedles":[]},{"id":"B22","cohort":"moneyflock_like","query":"Bank stocks in the black with sales growth above 8%, debt/equity below 1 and P/E below 18.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">","value":8},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":18},{"field":"sector","op":"==","value":"Financials"}],"assumptionNeedles":[]},{"id":"B23","cohort":"moneyflock_like","query":"Profitable biotech companies with revenue growth above 20%, high ROIC and P/S under 6.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">","value":20},{"field":"roic","op":">","value":15},{"field":"ps","op":"<","value":6},{"field":"sector","op":"==","value":"Healthcare"}],"assumptionNeedles":[]},{"id":"B24","cohort":"moneyflock_like","query":"Profitable materials names with revenue growth no less than 10%, little debt and a reasonable valuation.","expectedFilters":[{"field":"operatingMargin","op":">","value":0},{"field":"revGrowth","op":">=","value":10},{"field":"debtEquity","op":"<","value":1},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Materials"}],"assumptionNeedles":[]},{"id":"B25","cohort":"moneyflock_like","query":"Energy growth stocks with operating margin above 5%, debt/equity below 0.7 and P/E below 20.","expectedFilters":[{"field":"revGrowth","op":">","value":15},{"field":"operatingMargin","op":">","value":5},{"field":"debtEquity","op":"<","value":0.7},{"field":"pe","op":"<","value":20},{"field":"sector","op":"==","value":"Energy"}],"assumptionNeedles":[]},{"id":"E01","cohort":"experienced_retail","query":"Large-cap semiconductors with forward P/E below 28, PEG under 1.8, gross margin above 45%, and 3-year revenue CAGR over 12%.","expectedFilters":[{"field":"marketCap","op":">","value":50},{"field":"forwardPe","op":"<","value":28},{"field":"peg","op":"<","value":1.8},{"field":"grossMargin","op":">","value":45},{"field":"revGrowth3Y","op":">","value":12},{"field":"sector","op":"==","value":"Technology"}],"assumptionNeedles":[]},{"id":"E02","cohort":"experienced_retail","query":"Healthcare compounders with ROE above 18%, operating margin over 20%, 3Y EPS growth above 12%, debt/equity below 0.6.","expectedFilters":[{"field":"roe","op":">","value":18},{"field":"operatingMargin","op":">","value":20},{"field":"epsGrowth3Y","op":">","value":12},{"field":"debtEquity","op":"<","value":0.6},{"field":"sector","op":"==","value":"Healthcare"}],"assumptionNeedles":[]},{"id":"E03","cohort":"experienced_retail","query":"Financials with earnings yield above 7%, P/B below 1.8, payout ratio under 60%, dividend yield over 3%.","expectedFilters":[{"field":"earningsYield","op":">","value":7},{"field":"pb","op":"<","value":1.8},{"field":"payoutRatio","op":"<","value":60},{"field":"divYield","op":">","value":3},{"field":"sector","op":"==","value":"Financials"}],"assumptionNeedles":[]},{"id":"E04","cohort":"experienced_retail","query":"Consumer names with FCF yield above 4%, ROIC above 15%, gross margin above 35%, P/E under 25.","expectedFilters":[{"field":"fcfYield","op":">","value":4},{"field":"roic","op":">","value":15},{"field":"grossMargin","op":">","value":35},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Consumer"}],"assumptionNeedles":[]},{"id":"E05","cohort":"experienced_retail","query":"Industrials with EV/EBITDA between 8 and 14, interest coverage above 6, current ratio above 1.5, and beta below 1.1.","expectedFilters":[{"field":"evEbitda","op":">=","value":8},{"field":"evEbitda","op":"<=","value":14},{"field":"interestCoverage","op":">","value":6},{"field":"currentRatio","op":">","value":1.5},{"field":"beta","op":"<","value":1.1},{"field":"sector","op":"==","value":"Industrials"}],"assumptionNeedles":[]},{"id":"E06","cohort":"experienced_retail","query":"Energy stocks with forward PEG below 1.5, FCF margin above 12%, debt/equity below 0.8, and revenue growth above 10%.","expectedFilters":[{"field":"forwardPeg","op":"<","value":1.5},{"field":"fcfMargin","op":">","value":12},{"field":"debtEquity","op":"<","value":0.8},{"field":"revGrowth","op":">","value":10},{"field":"sector","op":"==","value":"Energy"}],"assumptionNeedles":[]},{"id":"E07","cohort":"experienced_retail","query":"Healthcare stocks with quick ratio above 1.2, current ratio above 2, ROE over 15%, and P/E below 30.","expectedFilters":[{"field":"quickRatio","op":">","value":1.2},{"field":"currentRatio","op":">","value":2},{"field":"roe","op":">","value":15},{"field":"pe","op":"<","value":30},{"field":"sector","op":"==","value":"Healthcare"}],"assumptionNeedles":[]},{"id":"E08","cohort":"experienced_retail","query":"Dividend-paying utilities with 5-year dividend growth above 5%, payout ratio below 70%, yield above 3.5%, beta under 0.9.","expectedFilters":[{"field":"divGrowth5Y","op":">","value":5},{"field":"payoutRatio","op":"<","value":70},{"field":"divYield","op":">","value":3.5},{"field":"beta","op":"<","value":0.9},{"field":"sector","op":"==","value":"Utilities"}],"assumptionNeedles":[]},{"id":"E09","cohort":"experienced_retail","query":"REITs yielding between 4% and 7%, payout ratio below 80%, beta below 1, market cap above $10B.","expectedFilters":[{"field":"divYield","op":">=","value":4},{"field":"divYield","op":"<=","value":7},{"field":"payoutRatio","op":"<","value":80},{"field":"beta","op":"<","value":1},{"field":"marketCap","op":">","value":10},{"field":"sector","op":"==","value":"Real Estate"}],"assumptionNeedles":[]},{"id":"E10","cohort":"experienced_retail","query":"Tech names with earnings yield above 4%, forward P/E under 24, PEG below 1.5, and revenue growth over 15%.","expectedFilters":[{"field":"earningsYield","op":">","value":4},{"field":"forwardPe","op":"<","value":24},{"field":"peg","op":"<","value":1.5},{"field":"revGrowth","op":">","value":15},{"field":"sector","op":"==","value":"Technology"}],"assumptionNeedles":[]},{"id":"E11","cohort":"experienced_retail","query":"Large healthcare companies with gross margin above 50%, ROE above 20%, 3Y revenue CAGR above 10%, debt/equity below 0.5.","expectedFilters":[{"field":"marketCap","op":">","value":50},{"field":"grossMargin","op":">","value":50},{"field":"roe","op":">","value":20},{"field":"revGrowth3Y","op":">","value":10},{"field":"debtEquity","op":"<","value":0.5},{"field":"sector","op":"==","value":"Healthcare"}],"assumptionNeedles":[]},{"id":"E12","cohort":"experienced_retail","query":"Financial stocks with P/B between 0.8 and 1.8, ROE above 12%, 5-year dividend growth above 4%, and payout ratio under 55%.","expectedFilters":[{"field":"pb","op":">=","value":0.8},{"field":"pb","op":"<=","value":1.8},{"field":"roe","op":">","value":12},{"field":"divGrowth5Y","op":">","value":4},{"field":"payoutRatio","op":"<","value":55},{"field":"sector","op":"==","value":"Financials"}],"assumptionNeedles":[]},{"id":"E13","cohort":"experienced_retail","query":"Consumer stocks with quick ratio >1, current ratio >1.5, operating margin >12%, FCF yield >3%.","expectedFilters":[{"field":"quickRatio","op":">","value":1},{"field":"currentRatio","op":">","value":1.5},{"field":"operatingMargin","op":">","value":12},{"field":"fcfYield","op":">","value":3},{"field":"sector","op":"==","value":"Consumer"}],"assumptionNeedles":[]},{"id":"E14","cohort":"experienced_retail","query":"Materials companies with EV/EBITDA under 10, earnings yield over 8%, debt/equity under 0.7, interest coverage above 8.","expectedFilters":[{"field":"evEbitda","op":"<","value":10},{"field":"earningsYield","op":">","value":8},{"field":"debtEquity","op":"<","value":0.7},{"field":"interestCoverage","op":">","value":8},{"field":"sector","op":"==","value":"Materials"}],"assumptionNeedles":[]},{"id":"E15","cohort":"experienced_retail","query":"Semis with forward PEG below 1.3, 3-year EPS CAGR above 15%, gross margin over 50%, and P/S below 8.","expectedFilters":[{"field":"forwardPeg","op":"<","value":1.3},{"field":"epsGrowth3Y","op":">","value":15},{"field":"grossMargin","op":">","value":50},{"field":"ps","op":"<","value":8},{"field":"sector","op":"==","value":"Technology"}],"assumptionNeedles":[]},{"id":"E16","cohort":"experienced_retail","query":"Energy companies with net debt/EBITDA below 1.5, EV/EBITDA under 8, FCF yield above 6%, and interest coverage above 5.","expectedFilters":[{"field":"evEbitda","op":"<","value":8},{"field":"fcfYield","op":">","value":6},{"field":"interestCoverage","op":">","value":5},{"field":"sector","op":"==","value":"Energy"}],"assumptionNeedles":["net-debt"]},{"id":"E17","cohort":"experienced_retail","query":"Tech companies buying back shares, ROIC above 18%, FCF yield over 4%, and P/E below 25.","expectedFilters":[{"field":"roic","op":">","value":18},{"field":"fcfYield","op":">","value":4},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Technology"}],"assumptionNeedles":["buyback"]},{"id":"E18","cohort":"experienced_retail","query":"Healthcare companies with insider ownership above 5%, revenue growth over 12%, operating margin over 15%, and P/E under 30.","expectedFilters":[{"field":"revGrowth","op":">","value":12},{"field":"operatingMargin","op":">","value":15},{"field":"pe","op":"<","value":30},{"field":"sector","op":"==","value":"Healthcare"}],"assumptionNeedles":["insider"]},{"id":"E19","cohort":"experienced_retail","query":"Dividend growers with at least a 10-year dividend growth streak, 5-year dividend growth above 6%, payout ratio below 60%, yield above 2.5%.","expectedFilters":[{"field":"divGrowth5Y","op":">","value":6},{"field":"payoutRatio","op":"<","value":60},{"field":"divYield","op":">","value":2.5}],"assumptionNeedles":["streak"]},{"id":"E20","cohort":"experienced_retail","query":"Consumer companies with free cash flow growth above 15%, ROIC over 15%, debt/equity below 0.7, and P/E under 25.","expectedFilters":[{"field":"roic","op":">","value":15},{"field":"debtEquity","op":"<","value":0.7},{"field":"pe","op":"<","value":25},{"field":"sector","op":"==","value":"Consumer"}],"assumptionNeedles":["cash flow growth"]},{"id":"E21","cohort":"experienced_retail","query":"Financials trading below 1.2x tangible book with ROE above 12%, earnings yield above 7%, and beta under 1.1.","expectedFilters":[{"field":"roe","op":">","value":12},{"field":"earningsYield","op":">","value":7},{"field":"beta","op":"<","value":1.1},{"field":"sector","op":"==","value":"Financials"}],"assumptionNeedles":["tangible book"]},{"id":"E22","cohort":"experienced_retail","query":"Utilities with dividend coverage above 1.5x, payout ratio below 70%, yield above 4%, and beta below 0.8.","expectedFilters":[{"field":"payoutRatio","op":"<","value":70},{"field":"divYield","op":">","value":4},{"field":"beta","op":"<","value":0.8},{"field":"sector","op":"==","value":"Utilities"}],"assumptionNeedles":["coverage"]},{"id":"E23","cohort":"experienced_retail","query":"Technology and Healthcare stocks with forward P/E below 30, ROE above 15%, gross margin above 40%, and 3Y revenue CAGR over 10%.","expectedFilters":[{"field":"sector","op":"in","value":"Technology|Healthcare"},{"field":"forwardPe","op":"<","value":30},{"field":"roe","op":">","value":15},{"field":"grossMargin","op":">","value":40},{"field":"revGrowth3Y","op":">","value":10}],"assumptionNeedles":[]},{"id":"E24","cohort":"experienced_retail","query":"Exclude Energy and Real Estate; show companies with earnings yield above 6%, ROIC above 12%, debt/equity below 0.8, and beta under 1.","expectedFilters":[{"field":"sector","op":"!=","value":"Energy"},{"field":"sector","op":"!=","value":"Real Estate"},{"field":"earningsYield","op":">","value":6},{"field":"roic","op":">","value":12},{"field":"debtEquity","op":"<","value":0.8},{"field":"beta","op":"<","value":1}],"assumptionNeedles":[]},{"id":"E25","cohort":"experienced_retail","query":"Large-cap quality compounders with ROIC above 18%, gross margin above 40%, 3-year revenue growth above 10%, FCF yield above 3%, and P/E below 30.","expectedFilters":[{"field":"marketCap","op":">","value":50},{"field":"roic","op":">","value":18},{"field":"grossMargin","op":">","value":40},{"field":"revGrowth3Y","op":">","value":10},{"field":"fcfYield","op":">","value":3},{"field":"pe","op":"<","value":30}],"assumptionNeedles":[]}];
          
          const key = (x: {field:string;op:string;value:string|number}) =>
            `${x.field}|${x.op}|${String(x.value).toLowerCase()}`;
          
          async function main() {
            const totals: Record<string, {pass:number; partial:number; fail:number}> = {
              moneyflock_like: {pass:0, partial:0, fail:0},
              experienced_retail: {pass:0, partial:0, fail:0},
              overall: {pass:0, partial:0, fail:0},
            };
          
            for (const c of cases) {
              const r = await parseQuery(c.query, [], [], "marketCap", "new");
              const actual = new Set(r.filters.map(key));
              const expected = new Set(c.expectedFilters.map(key));
              const missing = c.expectedFilters.filter(x => !actual.has(key(x))).map(key);
              const unexpected = r.filters.filter(x => !expected.has(key(x))).map(key);
              const joined = r.assumptions.join(" | ").toLowerCase();
              const missingAssumptions = c.assumptionNeedles.filter(n => !joined.includes(n.toLowerCase()));
              const matched = c.expectedFilters.length - missing.length;
              const exact = missing.length === 0 && unexpected.length === 0 && missingAssumptions.length === 0;
              const status = exact ? "PASS" : matched > 0 ? "PARTIAL" : "FAIL";
              totals[c.cohort][status.toLowerCase() as "pass"|"partial"|"fail"]++;
              totals.overall[status.toLowerCase() as "pass"|"partial"|"fail"]++;
          
              console.log(`${c.id} ${status} | ${c.query}`);
              if (!exact) {
                console.log(`  expected=${c.expectedFilters.map(key).join(", ")}`);
                console.log(`  actual=${r.filters.map(key).join(", ") || "(none)"}`);
                if (missing.length) console.log(`  missing=${missing.join(", ")}`);
                if (unexpected.length) console.log(`  unexpected=${unexpected.join(", ")}`);
                if (missingAssumptions.length) console.log(`  missingAssumptions=${missingAssumptions.join(", ")}`);
                if (r.assumptions.length) console.log(`  assumptions=${r.assumptions.join(" | ")}`);
              }
            }
          
            console.log("\n=== BLIND RETAIL-INVESTOR 50 V1 ===");
            for (const k of ["moneyflock_like","experienced_retail","overall"]) {
              const t = totals[k];
              console.log(`${k}: PASS ${t.pass} | PARTIAL ${t.partial} | FAIL ${t.fail}`);
            }
          }
          
          main().catch(err => { console.error(err); process.exit(1); });
          BLIND50EOF
          npx tsx eval/__blind50_v1_temp.ts
          rm eval/__blind50_v1_temp.ts
      - run: npm run test:investor-language
      - name: Run MoneyFlock-style 50-query gate
        shell: bash
        run: |
          output="$(npm run eval:moneyflock50)"
          echo "$output"
          grep -q "PASS: 50/50" <<< "$output"
          grep -q "PARTIAL: 0/50" <<< "$output"
          grep -q "FAIL: 0/50" <<< "$output"
      - run: npm run test:p0-parser
      - run: npm run eval:composite100
      - run: npm run eval:retail100
      - run: npm run build