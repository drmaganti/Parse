name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      GROQ_API_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:investor-language
      - name: Run MoneyFlock-style 50-query gate
        shell: bash
        run: |
          output="$(npm run eval:moneyflock50)"
          echo "$output"
          grep -q "PASS: 50/50" <<< "$output"
          grep -q "PARTIAL: 0/50" <<< "$output"
          grep -q "FAIL: 0/50" <<< "$output"
      - run: npm run test:p0-parser
      - run: npm run eval:composite100
      - run: npm run eval:retail100
      - run: npm run build