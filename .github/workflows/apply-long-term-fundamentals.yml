name: apply-long-term-fundamentals

on:
  push:
    branches: [agent/long-term-fundamentals]
    paths:
      - ".github/workflows/apply-long-term-fundamentals.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
      GROQ_API_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/long-term-fundamentals
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Create Supabase migration
        run: npx -y supabase@latest migration new long_term_fundamentals
      - name: Patch fundamental metrics end to end
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"target not found in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          # Finnhub: expose the nine requested long-term metrics using the existing basic-financials call.
          replace_once('lib/finnhub.ts',
          '''  revGrowth?: number;\n  high52?: number;''',
          '''  revGrowth?: number;\n  roic?: number;\n  operatingMargin?: number;\n  fcfMargin?: number;\n  fcfYield?: number;\n  debtEquity?: number;\n  interestCoverage?: number;\n  revGrowth3Y?: number;\n  epsGrowth3Y?: number;\n  evEbitda?: number;\n  high52?: number;''')

          replace_once('lib/finnhub.ts',
          '''export async function fetchMetrics(symbol: string, key: string): Promise<Metrics> {\n  const d = await get(`/stock/metric?symbol=${symbol}&metric=all`, key);\n  const m = d?.metric ?? {};\n  return {''',
          '''export async function fetchMetrics(symbol: string, key: string): Promise<Metrics> {\n  const d = await get(`/stock/metric?symbol=${symbol}&metric=all`, key);\n  const m = d?.metric ?? {};\n  const marketCap = num(m.marketCapitalization);\n  const enterpriseValue = num(m.enterpriseValue);\n  const evFcf = num(m["currentEv/freeCashFlowTTM"]);\n  const roicAnnual = latestAnnual(d?.series, "roic");\n  const fcfMarginAnnual = latestAnnual(d?.series, "fcfMargin");\n  const fcfYield = enterpriseValue != null && marketCap != null && marketCap > 0 && evFcf != null && evFcf !== 0\n    ? (enterpriseValue / evFcf / marketCap) * 100\n    : undefined;\n  return {''')

          replace_once('lib/finnhub.ts',
          '''    marketCap: num(m.marketCapitalization),                 // millions\n    pe: num(m.peTTM ?? m.peBasicExclExtraTTM),\n    pb: num(m.pbQuarterly ?? m.pbAnnual),\n    ps: num(m.psTTM),\n    divYield: num(m.dividendYieldIndicatedAnnual ?? m.currentDividendYieldTTM),\n    beta: num(m.beta),\n    revGrowth: num(m.revenueGrowthTTMYoy),\n    high52: num(m["52WeekHigh"]),''',
          '''    marketCap,                                               // millions\n    pe: num(m.peTTM ?? m.peBasicExclExtraTTM),\n    pb: num(m.pbQuarterly ?? m.pbAnnual),\n    ps: num(m.psTTM),\n    divYield: num(m.dividendYieldIndicatedAnnual ?? m.currentDividendYieldTTM),\n    beta: num(m.beta),\n    revGrowth: num(m.revenueGrowthTTMYoy),\n    roic: roicAnnual == null ? undefined : roicAnnual * 100,\n    operatingMargin: num(m.operatingMarginTTM),\n    fcfMargin: fcfMarginAnnual == null ? undefined : fcfMarginAnnual * 100,\n    fcfYield,\n    debtEquity: num(m["totalDebt/totalEquityQuarterly"]),\n    interestCoverage: num(m.netInterestCoverageTTM),\n    revGrowth3Y: num(m.revenueGrowth3Y),\n    epsGrowth3Y: num(m.epsGrowth3Y),\n    evEbitda: num(m.evEbitdaTTM),\n    high52: num(m["52WeekHigh"]),''')

          replace_once('lib/finnhub.ts',
          '''function num(v: any): number | undefined {\n  const x = Number(v);\n  return Number.isFinite(x) ? x : undefined;\n}\n''',
          '''function num(v: any): number | undefined {\n  const x = Number(v);\n  return Number.isFinite(x) ? x : undefined;\n}\n\nfunction latestAnnual(series: any, key: string): number | undefined {\n  const rows = series?.annual?.[key];\n  if (!Array.isArray(rows) || rows.length === 0) return undefined;\n  const latest = [...rows].sort((a, b) => String(b?.period ?? "").localeCompare(String(a?.period ?? "")))[0];\n  return num(latest?.v);\n}\n''')

          # Cached row schema / ingestion.
          replace_once('scripts/ingest.ts',
          '''  div_yield: number | null; beta: number | null; rev_growth: number | null;\n  rsi: number | null; sma50: number | null; sma200: number | null;''',
          '''  div_yield: number | null; beta: number | null; rev_growth: number | null;\n  roic: number | null; operating_margin: number | null; fcf_margin: number | null; fcf_yield: number | null;\n  debt_equity: number | null; interest_coverage: number | null; rev_growth_3y: number | null; eps_growth_3y: number | null; ev_ebitda: number | null;\n  rsi: number | null; sma50: number | null; sma200: number | null;''')

          replace_once('scripts/ingest.ts',
          '''      div_yield: round(metrics.divYield), beta: round(metrics.beta, 2),\n      rev_growth: round(metrics.revGrowth),\n      rsi: round(rsiVal),''',
          '''      div_yield: round(metrics.divYield), beta: round(metrics.beta, 2),\n      rev_growth: round(metrics.revGrowth),\n      roic: round(metrics.roic), operating_margin: round(metrics.operatingMargin),\n      fcf_margin: round(metrics.fcfMargin), fcf_yield: round(metrics.fcfYield),\n      debt_equity: round(metrics.debtEquity, 2), interest_coverage: round(metrics.interestCoverage, 1),\n      rev_growth_3y: round(metrics.revGrowth3Y), eps_growth_3y: round(metrics.epsGrowth3Y), ev_ebitda: round(metrics.evEbitda, 1),\n      rsi: round(rsiVal),''')

          # Shared field vocabulary.
          replace_once('lib/fields.ts',
          '''  revGrowth:   { key: "revGrowth",   col: "rev_growth",    label: "Rev growth", kind: "num", unit: "%" },\n  rsi:''',
          '''  revGrowth:   { key: "revGrowth",   col: "rev_growth",    label: "Rev growth", kind: "num", unit: "%" },\n  roic:        { key: "roic",        col: "roic",              label: "ROIC (FY)",       kind: "num", unit: "%" },\n  operatingMargin:{ key: "operatingMargin", col: "operating_margin", label: "Operating margin", kind: "num", unit: "%" },\n  fcfMargin:   { key: "fcfMargin",   col: "fcf_margin",        label: "FCF margin (FY)", kind: "num", unit: "%" },\n  fcfYield:    { key: "fcfYield",    col: "fcf_yield",         label: "FCF yield",       kind: "num", unit: "%" },\n  debtEquity:  { key: "debtEquity",  col: "debt_equity",       label: "Debt / equity",   kind: "num" },\n  interestCoverage:{ key: "interestCoverage", col: "interest_coverage", label: "Interest coverage", kind: "num", unit: "×" },\n  revGrowth3Y: { key: "revGrowth3Y", col: "rev_growth_3y",     label: "Revenue growth 3Y", kind: "num", unit: "%" },\n  epsGrowth3Y: { key: "epsGrowth3Y", col: "eps_growth_3y",     label: "EPS growth 3Y",   kind: "num", unit: "%" },\n  evEbitda:    { key: "evEbitda",    col: "ev_ebitda",         label: "EV / EBITDA",     kind: "num", unit: "×" },\n  rsi:''')

          replace_once('lib/fields.ts',
          '''  rev_growth: number | null;\n  rsi: number | null;''',
          '''  rev_growth: number | null;\n  roic: number | null;\n  operating_margin: number | null;\n  fcf_margin: number | null;\n  fcf_yield: number | null;\n  debt_equity: number | null;\n  interest_coverage: number | null;\n  rev_growth_3y: number | null;\n  eps_growth_3y: number | null;\n  ev_ebitda: number | null;\n  rsi: number | null;''')

          # Rules-first parsing for explicit long-term fundamentals.
          replace_once('lib/fallback-parse.ts',
          '''function fieldMention(q: string): string | null {\n  const tests:''',
          r'''const FUNDAMENTAL_TERMS: [string, string][] = [
  ["revGrowth3Y", "(?:3[- ]?year revenue growth|3y revenue growth|revenue growth (?:over )?(?:3[- ]?years|3y)|3[- ]?year revenue cagr|3y revenue cagr)"],
  ["epsGrowth3Y", "(?:3[- ]?year (?:eps|earnings) growth|3y (?:eps|earnings) growth|(?:eps|earnings) growth (?:over )?(?:3[- ]?years|3y)|3[- ]?year (?:eps|earnings) cagr|3y (?:eps|earnings) cagr)"],
  ["roic", "(?:\\broic\\b|return on invested capital)"],
  ["operatingMargin", "(?:operating margin|operating profit margin)"],
  ["fcfMargin", "(?:free cash flow margin|\\bfcf margin\\b)"],
  ["fcfYield", "(?:free cash flow yield|\\bfcf yield\\b)"],
  ["debtEquity", "(?:debt\\s*(?:to|/)\\s*equity|debt[- ]?equity ratio)"],
  ["interestCoverage", "(?:interest coverage|interest cover)"],
  ["evEbitda", "(?:ev\\s*(?:to|/)\\s*ebitda|enterprise value\\s*(?:to|/)\\s*ebitda)"],
];

function fieldMention(q: string): string | null {
  const fundamental = FUNDAMENTAL_TERMS.find(([, term]) => new RegExp(term).test(q));
  if (fundamental) return fundamental[0];
  const tests:''')

          replace_once('lib/fallback-parse.ts',
          '''function hasKnownUnsupportedMetric(q: string): boolean {\n  return /\\broic\\b|return on invested capital|\\broe\\b|return on equity|\\broa\\b|return on assets|free cash flow|\\bfcf\\b|debt\\s*(?:to|\\/)\\s*ebitda|ev\\s*(?:to|\\/)\\s*ebitda|\\bpeg\\b|current ratio|interest coverage|earnings growth|eps growth|profit growth|debt\\s*(?:to|\\/)\\s*equity/.test(q);\n}''',
          '''function hasKnownUnsupportedMetric(q: string): boolean {\n  return /\\broe\\b|return on equity|\\broa\\b|return on assets|(?:free cash flow|\\bfcf\\b)(?!\\s+(?:margin|yield))|debt\\s*(?:to|\\/)\\s*ebitda|\\bpeg\\b|current ratio|profit growth/.test(q);\n}''')

          replace_once('lib/fallback-parse.ts',
          '''  addRange(out, "rsi", q.match(/\\brsi\\b[^\\d-]*between\\s*(-?\\d+(?:\\.\\d+)?)\\s*(?:and|to)\\s*(-?\\d+(?:\\.\\d+)?)/));\n\n  if (!out.some((f) => f.field === "pe"))''',
          '''  addRange(out, "rsi", q.match(/\\brsi\\b[^\\d-]*between\\s*(-?\\d+(?:\\.\\d+)?)\\s*(?:and|to)\\s*(-?\\d+(?:\\.\\d+)?)/));\n  for (const [field, term] of FUNDAMENTAL_TERMS) {\n    if (!out.some((f) => f.field === field)) addRange(out, field, q.match(new RegExp(`${term}[^\\d-]*between\\s*(-?\\d+(?:\\.\\d+)?)\\s*(?:and|to)\\s*(-?\\d+(?:\\.\\d+)?)`)));\n  }\n\n  if (!out.some((f) => f.field === "pe"))''')

          replace_once('lib/fallback-parse.ts',
          '''  if (!out.some((f) => f.field === "rsi")) addThreshold(out, "rsi", q.match(new RegExp(`\\\\brsi\\\\b[^\\\\d-]*?(${cmp})\\\\s*(-?\\\\d+(?:\\\\.\\\\d+)?)`)));\n\n  const positiveGrowth''',
          '''  if (!out.some((f) => f.field === "rsi")) addThreshold(out, "rsi", q.match(new RegExp(`\\\\brsi\\\\b[^\\\\d-]*?(${cmp})\\\\s*(-?\\\\d+(?:\\\\.\\\\d+)?)`)));\n  for (const [field, term] of FUNDAMENTAL_TERMS) {\n    if (!out.some((f) => f.field === field)) addThreshold(out, field, q.match(new RegExp(`${term}[^\\\\d-]*?(${cmp})\\\\s*(-?\\\\d+(?:\\\\.\\\\d+)?)`)));\n  }\n\n  const positiveGrowth''')

          replace_once('lib/fallback-parse.ts',
          '''  if (!out.some((f) => f.field === "revGrowth")) addThreshold(out, "revGrowth",''',
          '''  if (!out.some((f) => f.field === "revGrowth") && !out.some((f) => f.field === "revGrowth3Y")) addThreshold(out, "revGrowth",''')

          replace_once('lib/fallback-parse.ts',
          '''    if (!out.some((f) => f.field === "revGrowth") && !/highest growth/.test(q)) addUnique(out, mk("revGrowth", ">", 15));''',
          '''    if (!out.some((f) => f.field === "revGrowth") && !out.some((f) => f.field === "revGrowth3Y") && !/highest growth/.test(q)) addUnique(out, mk("revGrowth", ">", 15));''')

          # Signed-in result table: make active new metrics visible automatically.
          replace_once('app/page.tsx',
          '''function formatFilter(f: Pick<Filter, "field" | "op" | "value">) { const m = FIELDS[f.field]; if (!m) return `${f.field} ${f.op} ${f.value}`; if (m.kind === "cat") return `${m.label} ${f.op === "!=" ? "is not" : "is"} ${f.value}`; return `${m.label} ${f.op} ${f.value}${m.unit === "%" ? "%" : ""}`; }''',
          '''function formatFilter(f: Pick<Filter, "field" | "op" | "value">) { const m = FIELDS[f.field]; if (!m) return `${f.field} ${f.op} ${f.value}`; if (m.kind === "cat") return `${m.label} ${f.op === "!=" ? "is not" : "is"} ${f.value}`; return `${m.label} ${f.op} ${f.value}${m.unit ?? ""}`; }''')

          replace_once('app/page.tsx',
          '''const pct = (v: any) => v == null ? "—" : Number(v).toFixed(1) + "%";\nconst ALL_COLS: Record<string, Col> = {\n  market_cap: { key: "market_cap", label: "Mkt cap", fmt: (v) => v == null ? "—" : `$${v}B` }, pe: { key: "pe", label: "P/E", fmt: (v) => fmtNum(v) }, pb: { key: "pb", label: "P/B", fmt: (v) => fmtNum(v) }, ps: { key: "ps", label: "P/S", fmt: (v) => fmtNum(v) }, div_yield: { key: "div_yield", label: "Yield", fmt: pct }, beta: { key: "beta", label: "Beta", fmt: (v) => fmtNum(v, 2) }, rev_growth: { key: "rev_growth", label: "Rev gr.", fmt: pct }, rsi: { key: "rsi", label: "RSI", fmt: (v) => fmtNum(v, 0) }, from_52w_high: { key: "from_52w_high", label: "% off high", fmt: pct },\n};''',
          '''const pct = (v: any) => v == null ? "—" : Number(v).toFixed(1) + "%";\nconst mult = (v: any) => v == null ? "—" : Number(v).toFixed(1) + "×";\nconst ALL_COLS: Record<string, Col> = {\n  market_cap: { key: "market_cap", label: "Mkt cap", fmt: (v) => v == null ? "—" : `$${v}B` }, pe: { key: "pe", label: "P/E", fmt: (v) => fmtNum(v) }, pb: { key: "pb", label: "P/B", fmt: (v) => fmtNum(v) }, ps: { key: "ps", label: "P/S", fmt: (v) => fmtNum(v) }, div_yield: { key: "div_yield", label: "Yield", fmt: pct }, beta: { key: "beta", label: "Beta", fmt: (v) => fmtNum(v, 2) }, rev_growth: { key: "rev_growth", label: "Rev gr.", fmt: pct },\n  roic: { key: "roic", label: "ROIC FY", fmt: pct }, operating_margin: { key: "operating_margin", label: "Op. margin", fmt: pct }, fcf_margin: { key: "fcf_margin", label: "FCF margin FY", fmt: pct }, fcf_yield: { key: "fcf_yield", label: "FCF yield", fmt: pct }, debt_equity: { key: "debt_equity", label: "Debt/equity", fmt: (v) => fmtNum(v, 2) }, interest_coverage: { key: "interest_coverage", label: "Interest cover", fmt: mult }, rev_growth_3y: { key: "rev_growth_3y", label: "Rev gr. 3Y", fmt: pct }, eps_growth_3y: { key: "eps_growth_3y", label: "EPS gr. 3Y", fmt: pct }, ev_ebitda: { key: "ev_ebitda", label: "EV/EBITDA", fmt: mult },\n  rsi: { key: "rsi", label: "RSI", fmt: (v) => fmtNum(v, 0) }, from_52w_high: { key: "from_52w_high", label: "% off high", fmt: pct },\n};''')

          # Guest result table: expose active long-term metrics alongside the baseline columns.
          replace_once('app/try/page.tsx',
          '''  const displayedResults = useMemo(() => {''',
          '''  const activeMetricCols = useMemo(() => Array.from(new Set(filters.flatMap((f) => {\n    const meta = FIELDS[f.field];\n    if (!meta || meta.kind !== "num" || ["price", "market_cap", "pe", "chg_1w"].includes(meta.col)) return [];\n    return [meta.col as keyof StockRow];\n  }))).slice(0, 4), [filters]);\n\n  const displayedResults = useMemo(() => {''')

          replace_once('app/try/page.tsx',
          '''          <th aria-sort={ariaSort("pe")} onClick={() => toggleSort("pe")} style={headerStyle("right")}>P/E{sortArrow("pe")}</th>\n          <th aria-sort={ariaSort("chg_1w")}''',
          '''          <th aria-sort={ariaSort("pe")} onClick={() => toggleSort("pe")} style={headerStyle("right")}>P/E{sortArrow("pe")}</th>\n          {activeMetricCols.map((col) => <th key={String(col)} aria-sort={ariaSort(col)} onClick={() => toggleSort(col)} style={headerStyle("right")}>{fieldMetaForColumn(col)?.label || String(col)}{sortArrow(col)}</th>)}\n          <th aria-sort={ariaSort("chg_1w")}''')

          replace_once('app/try/page.tsx',
          '''</td><td style={{ padding: 8, borderBottom: `1px solid ${T.border}`, textAlign: "right", fontFamily: MONO, fontSize: 13 }}>{r.pe == null ? "—" : Number(r.pe).toFixed(1)}</td><td style={{ padding: 8, borderBottom: `1px solid ${T.border}`, textAlign: "right", fontFamily: MONO, fontSize: 13, color: (r.chg_1w ?? 0) >= 0 ? T.gain : T.loss }}>{r.chg_1w''',
          '''</td><td style={{ padding: 8, borderBottom: `1px solid ${T.border}`, textAlign: "right", fontFamily: MONO, fontSize: 13 }}>{r.pe == null ? "—" : Number(r.pe).toFixed(1)}</td>{activeMetricCols.map((col) => <td key={String(col)} style={{ padding: 8, borderBottom: `1px solid ${T.border}`, textAlign: "right", fontFamily: MONO, fontSize: 13 }}>{formatMetricCell(col, r[col])}</td>)}<td style={{ padding: 8, borderBottom: `1px solid ${T.border}`, textAlign: "right", fontFamily: MONO, fontSize: 13, color: (r.chg_1w ?? 0) >= 0 ? T.gain : T.loss }}>{r.chg_1w''')

          replace_once('app/try/page.tsx',
          '''function FilterChip({ f, onEdit, onRemove }:''',
          '''function fieldMetaForColumn(col: keyof StockRow) { return Object.values(FIELDS).find((m) => m.col === col); }\nfunction formatMetricCell(col: keyof StockRow, value: any) {\n  if (value == null) return "—";\n  const meta = fieldMetaForColumn(col);\n  if (meta?.unit === "%") return `${Number(value).toFixed(1)}%`;\n  if (meta?.unit === "×") return `${Number(value).toFixed(1)}×`;\n  if (meta?.unit === "$B") return `$${Number(value).toFixed(1)}B`;\n  return Number(value).toFixed(2);\n}\n\nfunction FilterChip({ f, onEdit, onRemove }:''')

          # Schema reference file.
          replace_once('supabase/schema.sql',
          '''  rev_growth     numeric,          -- percent YoY\n  rsi            numeric,''',
          '''  rev_growth     numeric,          -- percent YoY\n  roic           numeric,          -- percent; latest fiscal-year value\n  operating_margin numeric,        -- percent TTM\n  fcf_margin     numeric,          -- percent; latest fiscal-year value\n  fcf_yield      numeric,          -- percent; derived from Finnhub EV/FCF and market cap\n  debt_equity    numeric,          -- total debt / total equity\n  interest_coverage numeric,       -- TTM multiple\n  rev_growth_3y  numeric,          -- percent 3-year CAGR\n  eps_growth_3y  numeric,          -- percent 3-year CAGR\n  ev_ebitda      numeric,          -- TTM multiple\n  rsi            numeric,''')

          replace_once('supabase/schema.sql',
          '''alter table public.stocks enable row level security;''',
          '''alter table public.stocks add column if not exists roic numeric;\nalter table public.stocks add column if not exists operating_margin numeric;\nalter table public.stocks add column if not exists fcf_margin numeric;\nalter table public.stocks add column if not exists fcf_yield numeric;\nalter table public.stocks add column if not exists debt_equity numeric;\nalter table public.stocks add column if not exists interest_coverage numeric;\nalter table public.stocks add column if not exists rev_growth_3y numeric;\nalter table public.stocks add column if not exists eps_growth_3y numeric;\nalter table public.stocks add column if not exists ev_ebitda numeric;\n\nalter table public.stocks enable row level security;''')

          # Regression cases: explicit thresholds, combinations and refinement/removal.
          p = Path('eval/cases.json')
          data = json.loads(p.read_text())
          new_cases = [
            {"query":"ROIC above 12%","expect":{"filters":[{"field":"roic","op":">","value":12}]}},
            {"query":"Operating margin above 15%","expect":{"filters":[{"field":"operatingMargin","op":">","value":15}]}},
            {"query":"FCF margin over 10%","expect":{"filters":[{"field":"fcfMargin","op":">","value":10}]}},
            {"query":"Free cash flow yield above 3%","expect":{"filters":[{"field":"fcfYield","op":">","value":3}]}},
            {"query":"Debt to equity below 1","expect":{"filters":[{"field":"debtEquity","op":"<","value":1}]}},
            {"query":"Interest coverage above 5","expect":{"filters":[{"field":"interestCoverage","op":">","value":5}]}},
            {"query":"3-year revenue growth above 8%","expect":{"filters":[{"field":"revGrowth3Y","op":">","value":8}]}},
            {"query":"3-year EPS growth above 10%","expect":{"filters":[{"field":"epsGrowth3Y","op":">","value":10}]}},
            {"query":"EV/EBITDA under 15","expect":{"filters":[{"field":"evEbitda","op":"<","value":15}]}},
            {"query":"ROIC above 10%, FCF margin above 8%, and debt/equity below 1","expect":{"filters":[{"field":"roic","op":">","value":10},{"field":"fcfMargin","op":">","value":8},{"field":"debtEquity","op":"<","value":1}],"filterCount":3}},
            {"query":"Remove ROIC","mode":"refine","previous":[{"field":"roic","op":">","value":10},{"field":"pe","op":"<","value":25}],"expect":{"filters":[{"field":"pe","op":"<","value":25}],"filterCount":1},"reject":[{"field":"roic"}]},
          ]
          existing = {c.get('query') for c in data['cases']}
          data['cases'].extend(c for c in new_cases if c['query'] not in existing)
          p.write_text(json.dumps(data, indent=2) + '\n')

      - name: Write migration SQL
        run: |
          MIG=$(ls -t supabase/migrations/*_long_term_fundamentals.sql | head -1)
          cat > "$MIG" <<'SQL'
          alter table public.stocks add column if not exists roic numeric;
          alter table public.stocks add column if not exists operating_margin numeric;
          alter table public.stocks add column if not exists fcf_margin numeric;
          alter table public.stocks add column if not exists fcf_yield numeric;
          alter table public.stocks add column if not exists debt_equity numeric;
          alter table public.stocks add column if not exists interest_coverage numeric;
          alter table public.stocks add column if not exists rev_growth_3y numeric;
          alter table public.stocks add column if not exists eps_growth_3y numeric;
          alter table public.stocks add column if not exists ev_ebitda numeric;
          SQL
          echo "Migration: $MIG"
      - run: npm ci
      - run: npm run test:p0-parser
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "drmaganti"
          git config user.email "ram.maganti@outlook.com"
          git add -A
          git commit -m "Add long-term fundamental screening metrics"
          git push origin HEAD:agent/long-term-fundamentals
